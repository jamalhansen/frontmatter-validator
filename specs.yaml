# Content Format Spec Configuration

universal:
  - category
  - status
  - created
  - tags

categories:
  "blog post":
    aliases: ["blog post", "blog-post", "[[blog post]]"]
    # The statuses the tools agree on: calib write prompts outlines and drafts,
    # obsidian-hugo publishes live only on published, blog-validate skips an
    # outline's code. Anything else (2026-10-10: "editing") works by accident
    # in one tool and is invisible to the others.
    statuses: [outline, draft, published]
    fields:
      - title
      - description
      - author
      - date
      - lastmod
      - series
      - series_position
      - newsletter_url
      - promo_file
      - slug
      - image
      - unsplash_id
      - unsplash_name
      - unsplash_user
      - draft
      - weight
      - published_date
      - canonical_url
      - cover
      - alt
      - source
      - source_note
      - origin
      - inspired_by
      - ready_after
  "find":
    aliases: ["find", "[[find]]"]
    fields:
      - source_url
      - source_title
      - source_author
      - source_type
      - captured
      - related
      - published_date
  "newsletter":
    aliases: ["newsletter", "[[newsletter]]"]
    fields:
      - issue_number
      - beehiiv_url
      - blog_post
      - finds_included
      - related
      - Week
      - title
      - subtitle
      - type
      - published_date
  "standalone":
    aliases: ["standalone", "[[standalone]]"]
    fields: []
  "series":
    # A series landing/index/reference page, not a post in the series --
    # found live 2026-09-20: 4 different category values in real use for
    # this same content type (none recognized by the spec before this),
    # so every one of these files was invisible to validation entirely,
    # including whether it had a status set.
    aliases:
      - series
      - "[[series]]"
      - "blog series"
      - "[[blog series]]"
      - "series index"
      - "[[series index]]"
      - "series reference"
      - "[[series reference]]"
      - "series foundation"
      - "[[series foundation]]"
    fields:
      - title
      - series
      - persona
      - origin
      - source_note

validations:
  - field: status
    value: published
    require: [published_date]
  - field: status
    value: published
    when_category: ["blog post"]
    # canonical_url points at a jamalhansen.com/blog/<slug>/ page -- only
    # meaningful for actual blog posts. Found live 2026-09-20: 28 published
    # finds/newsletter issues were failing this requirement even though
    # they were never blog posts and have no slug to derive one from --
    # finds even ship a template canonical_url: "" placeholder that this
    # rule was treating as "still needs filling."
    require: [canonical_url]
  # A draft needs its description before it reaches the publish tool, which
  # refuses a post without one (obsidian-hugo check). Outlines and the old
  # series drafts are left alone: 28 outlines and 26 published series posts
  # lack one (2026-10-10), and flagging them weekly is noise, not a signal.
  - field: status
    value: draft
    when_category: ["blog post"]
    require: [description]
  - field: status
    value: editing
    when_category: ["blog post"]
    require: [description]
